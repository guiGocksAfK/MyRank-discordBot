[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_return_any = true

# myrank/ nao depende do discord.py e por isso e 100% tipavel.
[[tool.mypy.overrides]]
module = "myrank.*"
strict = true

[[tool.mypy.overrides]]
module = ["discord.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
